name: Check builder store cache reachability
description: >-
  Fail fast unless the Attic HTTP cache is reachable both from the
  coordinator and from the first builder. Nix can remember a failed
  substituter for the rest of a session, while the cache job joins the
  tailnet in parallel, so this check must pass before builds start.

inputs:
  cache-host:
    description: Hostname of the builder cache node on the tailnet.
    required: true
  cache-name:
    description: Attic cache name.
    required: false
    default: builder
  cache-port:
    description: Attic HTTP port.
    required: false
    default: '8080'
  builders-json:
    description: 'Builder matrix JSON ({"include": [{"id", ...}, ...]}).'
    required: true
  builder-prefix:
    description: Hostname prefix of the builders (e.g. nix-b-<run_id>-<attempt>).
    required: true
  attempts:
    description: Number of bounded probes with a 5-second backoff.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Check builder store cache reachability
      shell: bash
      env:
        CACHE_HOST: ${{ inputs.cache-host }}
        CACHE_NAME: ${{ inputs.cache-name }}
        CACHE_PORT: ${{ inputs.cache-port }}
        BUILDERS: ${{ inputs.builders-json }}
        BUILDER_PREFIX: ${{ inputs.builder-prefix }}
        ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail
        if [[ ! "${ATTEMPTS}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::attempts must be a positive integer, got ${ATTEMPTS}."
          exit 1
        fi
        first_id="$(jq -r '.include[0].id // empty' <<<"${BUILDERS}")"
        if [[ -z "${first_id}" ]]; then
          echo '::error::Builder matrix is empty.'
          exit 1
        fi
        first_builder="${BUILDER_PREFIX}-${first_id}"
        cache_url="http://${CACHE_HOST}:${CACHE_PORT}/${CACHE_NAME}/nix-cache-info"
        curl_args=(
          --connect-timeout 5
          --max-time 10
          --fail
          --silent
          --show-error
        )
        ssh_args=(
          -n
          -o ConnectTimeout=5
          -o ConnectionAttempts=1
          -o BatchMode=yes
          -o ServerAliveInterval=5
          -o ServerAliveCountMax=2
        )
        remote_probe="test -e /tmp/builder-cache-ready && curl --connect-timeout 5 --max-time 10 --fail --silent --show-error '${cache_url}' >/dev/null"
        cache_ok=false
        for ((i = 0; i < ATTEMPTS; i++)); do
          # The fixed probe is intentionally assembled on the coordinator.
          # shellcheck disable=SC2029
          if curl "${curl_args[@]}" "${cache_url}" >/dev/null 2>&1 &&
            ssh "${ssh_args[@]}" "root@${first_builder}" \
              "${remote_probe}" 2>/dev/null; then
            cache_ok=true
            break
          fi
          sleep 5
        done
        if [[ "${cache_ok}" != true ]]; then
          err_direct="$(curl "${curl_args[@]}" "${cache_url}" 2>&1 || true)"
          # shellcheck disable=SC2029
          err_builder="$(ssh "${ssh_args[@]}" "root@${first_builder}" \
            "${remote_probe}" 2>&1 || true)"
          echo "::error::The Attic builder cache is not reachable over HTTP. Direct: ${err_direct} / via builder: ${err_builder}"
          exit 1
        fi
        # Diagnostics only: report whether the tailnet paths to the cache
        # node are direct or relayed (DERP). A relayed path would show up
        # as slow uploads and narinfo queries during the build.
        tailscale ping -c 2 "${CACHE_HOST}" 2>&1 | tail -2 \
          | sed 's/^/tailscale coordinator->cache: /' || true
        # shellcheck disable=SC2029
        ssh "${ssh_args[@]}" "root@${first_builder}" \
          "tailscale ping -c 2 '${CACHE_HOST}' 2>&1 | tail -2" 2>/dev/null \
          | sed 's/^/tailscale builder->cache: /' || true
