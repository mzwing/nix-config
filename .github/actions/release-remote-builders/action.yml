name: Release remote builders
description: >-
  Signal every builder in the matrix that the run is over
  (/tmp/builder_done), so the builder jobs can exit. Optionally also
  signal the builder store cache machine (/tmp/cache_done), so its
  signing loop can end. Intended to run with `if: always()`.

inputs:
  builders-json:
    description: 'Builder matrix JSON ({"include": [{"id", ...}, ...]}).'
    required: true
  builder-prefix:
    description: Hostname prefix of the builders (e.g. nix-b-<run_id>-<attempt>).
    required: true
  cache-host:
    description: >-
      Optional hostname of the builder store cache node on the tailnet;
      when set, it is signaled too.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Release remote builders
      shell: bash
      env:
        BUILDERS_JSON: ${{ inputs.builders-json }}
        BUILDER_PREFIX: ${{ inputs.builder-prefix }}
        CACHE_HOST: ${{ inputs.cache-host }}
      run: |
        while IFS= read -r id; do
          ssh -n -o ConnectTimeout=5 "root@${BUILDER_PREFIX}-${id}" \
            'touch /tmp/builder_done' || true
        done < <(jq -r '.include[].id' <<<"${BUILDERS_JSON}")
        if [[ -n "${CACHE_HOST}" ]]; then
          ssh -n -o ConnectTimeout=5 "root@${CACHE_HOST}" \
            'touch /tmp/cache_done' || true
        fi
