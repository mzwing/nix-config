name: Stage builder store cache checkpoint
description: >-
  Wait for the coordinator's checkpoint signal, the done file, or a
  timeout; on signal or timeout, stage a consistent mid-run snapshot of
  the live Attic data (online SQLite backup plus hardlinked write-once
  storage) for a following cache save step. Rounds where the run is
  already finishing, atticd died, or nothing changed since the previous
  round stage nothing, so cancelled long builds still leave a recent warm
  generation behind without redundant uploads.

outputs:
  checkpoint-ready:
    description: Whether a new snapshot was staged for saving.
    value: ${{ steps.stage.outputs.checkpoint-ready }}

inputs:
  data-dir:
    description: Live Attic data directory.
    required: false
    default: /nix/attic-data
  checkpoint-dir:
    description: Staging directory saved by the following cache save step.
    required: false
    default: /nix/attic-checkpoint
  done-file:
    description: File whose creation ends the serving loop.
    required: false
    default: /tmp/cache_done
  signal-file:
    description: File the coordinator touches to request a checkpoint.
    required: false
    default: /tmp/cache_checkpoint
  timeout-minutes:
    description: Maximum wait before staging a periodic checkpoint anyway.
    required: false
    default: '90'

runs:
  using: composite
  steps:
    - name: Wait and stage
      id: stage
      if: ${{ !cancelled() }}
      shell: bash
      env:
        DATA_DIR: ${{ inputs.data-dir }}
        CHECKPOINT_DIR: ${{ inputs.checkpoint-dir }}
        DONE_FILE: ${{ inputs.done-file }}
        SIGNAL_FILE: ${{ inputs.signal-file }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        set -euo pipefail
        if [[ ! "${TIMEOUT_MINUTES}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::timeout-minutes must be a positive integer, got ${TIMEOUT_MINUTES}."
          exit 1
        fi
        ready=false
        deadline=$(( SECONDS + TIMEOUT_MINUTES * 60 ))
        atticd_pid="$(cat /tmp/atticd.pid)"
        while (( SECONDS < deadline )); do
          [[ -e "${SIGNAL_FILE}" || -e "${DONE_FILE}" ]] && break
          kill -0 "${atticd_pid}" 2>/dev/null || break
          sleep 20
        done
        if [[ ! -e "${DONE_FILE}" ]] && kill -0 "${atticd_pid}" 2>/dev/null; then
          count="$(sqlite3 "${DATA_DIR}/server.db" 'SELECT count(*) FROM object;')"
          previous="$(cat /tmp/attic-chk-count 2>/dev/null || echo -1)"
          if [[ "${count}" != "${previous}" ]]; then
            echo "Staging mid-run Attic snapshot (${count} objects, previously ${previous})..."
            find "${CHECKPOINT_DIR}" -mindepth 1 -delete
            sqlite3 "${DATA_DIR}/server.db" ".backup '${CHECKPOINT_DIR}/server.db'"
            cp -al "${DATA_DIR}/storage" "${CHECKPOINT_DIR}/storage"
            printf '%s\n' "${count}" >/tmp/attic-chk-count
            ready=true
            echo "Checkpoint staged: $(du -sh "${CHECKPOINT_DIR}" | cut -f1)."
          else
            echo "Attic object count unchanged (${count}); skipping this checkpoint round."
          fi
        fi
        echo "checkpoint-ready=${ready}" >>"${GITHUB_OUTPUT}"
