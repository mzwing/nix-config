name: Commit and push
description: >-
  Stage the given paths, commit as github-actions[bot] if anything
  changed, push to the current ref and optionally trigger another
  workflow.

inputs:
  paths:
    description: Paths to stage (space-separated, e.g. "devenv.lock flake.lock").
    required: true
  message:
    description: Commit message.
    required: true
  trigger-workflow:
    description: >-
      Workflow file to trigger with `gh workflow run` after a successful
      push (e.g. build.yml). Leave empty to skip.
    required: false
    default: ''
  github-token:
    description: GitHub token for `gh workflow run` (usually github.token).
    required: false
    default: ''

outputs:
  changed:
    description: Whether a commit was created ("true"/"false").
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Commit changes
      id: commit
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # PATHS is a space-separated list and must word-split.
        # shellcheck disable=SC2086
        git add -- ${PATHS}

        if git diff --cached --quiet; then
          echo "changed=false" >>"${GITHUB_OUTPUT}"
          exit 0
        fi

        git commit -m "${MESSAGE}"
        echo "changed=true" >>"${GITHUB_OUTPUT}"

    - name: Push changes
      if: steps.commit.outputs.changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        branch: ${{ github.ref }}

    - name: Trigger workflow
      if: steps.commit.outputs.changed == 'true' && inputs.trigger-workflow != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TRIGGER_WORKFLOW: ${{ inputs.trigger-workflow }}
      run: gh workflow run "${TRIGGER_WORKFLOW}" --ref "${GITHUB_REF}"
