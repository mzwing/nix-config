name: Finalize builder store cache
description: >-
  Wait for the coordinator to finish, then deterministically prune the
  Attic generation against reconciliation's keep-set, remove objects that
  became publicly available, reap orphan NARs, checkpoint and verify the
  SQLite database, and stop atticd. Pairs with start-builder-store-cache.
  Emits save-ready only after the persisted data is internally consistent.

outputs:
  save-ready:
    description: Whether Attic shut down, pruned/checkpointed, and passed integrity checks.
    value: ${{ steps.attic.outputs.save-ready }}

inputs:
  cache-host:
    description: Tailnet hostname clients use for the Attic endpoint.
    required: false
    default: ''
  cache-name:
    description: Attic cache name.
    required: false
    default: builder
  data-dir:
    description: Directory persisted by GitHub Actions Cache.
    required: false
    default: /nix/attic-data
  done-file:
    description: File whose creation ends the serving loop.
    required: false
    default: /tmp/cache_done
  keep-paths-file:
    description: >-
      Deterministic retention set installed by reconciliation. When missing
      after completion, all uploaded objects are preserved instead.
    required: false
    default: /tmp/attic-keep-paths.txt
  deadline-minutes:
    description: Backstop deadline for the serving loop.
    required: false
    default: '390'
  upstream-substituters:
    description: >-
      Newline-separated public binary-cache URLs. Current Attic objects found
      in any of these caches during shutdown are removed from private storage.
    required: false
    default: |-
      https://cache.nixos.org
      https://cache.nixos-cuda.org
      https://mzwing.cachix.org
      https://nix-community.cachix.org
      https://devenv.cachix.org
      https://attic.xuyh0120.win/lantian

runs:
  using: composite
  steps:
    - name: Finalize Attic
      id: attic
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-name }}
        DATA_DIR: ${{ inputs.data-dir }}
        DONE_FILE: ${{ inputs.done-file }}
        KEEP_PATHS_FILE: ${{ inputs.keep-paths-file }}
        DEADLINE_MINUTES: ${{ inputs.deadline-minutes }}
        UPSTREAM_SUBSTITUTERS: ${{ inputs.upstream-substituters }}
      run: |
        set -euo pipefail
        if [[ ! "${DEADLINE_MINUTES}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::deadline-minutes must be a positive integer, got ${DEADLINE_MINUTES}."
          exit 1
        fi
        if [[ ! -s /tmp/atticd.pid || ! -s /tmp/atticd-bin ]]; then
          echo '::error::Attic startup state is missing; the start action did not run here.'
          exit 1
        fi
        atticd_pid="$(cat /tmp/atticd.pid)"
        atticd_bin="$(cat /tmp/atticd-bin)"
        config=/tmp/attic-server.toml
        database="${DATA_DIR}/server.db"

        # An early-finishing coordinator may have created the done file
        # before this step started; the loop then ends immediately.
        deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
        until [[ -e "${DONE_FILE}" ]]; do
          if ! kill -0 "${atticd_pid}" 2>/dev/null; then
            echo '::error::Attic stopped while builders were active.'
            cat /tmp/atticd.log
            exit 1
          fi
          if (( $(date +%s) >= deadline )); then
            echo '::error::Timed out waiting for the coordinator; refusing to save an active Attic database.'
            exit 1
          fi
          sleep 15
        done

        if kill -0 "${atticd_pid}" 2>/dev/null; then
          kill "${atticd_pid}" 2>/dev/null || true
          wait "${atticd_pid}" 2>/dev/null || true
        fi

        # A successful completed run provides its deterministic keep-set.
        # On red/cancelled coordinator runs, preserve every successfully
        # uploaded object in this generation rather than pruning from an
        # incomplete closure; the next successful run prunes it.
        if [[ -e "${DONE_FILE}" && ! -e "${KEEP_PATHS_FILE}" ]]; then
          echo '::warning::Coordinator finished without an Attic keep-set; preserving all uploaded objects.'
          KEEP_PATHS_FILE=''
        fi

        if [[ -n "${KEEP_PATHS_FILE}" && -e "${KEEP_PATHS_FILE}" ]]; then
          sort --unique "${KEEP_PATHS_FILE}" > /tmp/attic-keep-paths.sorted
          if ! sqlite3 "${database}" \
            "SELECT store_path, cache_id, nar_id, deriver FROM object LIMIT 0;" \
            >/dev/null 2>&1; then
            echo '::error::Attic database schema no longer matches deterministic pruning.'
            exit 1
          fi
          before="$(sqlite3 "${database}" 'SELECT count(*) FROM object;')"
          # Use a one-column import schema: creating a wider table and then
          # importing a one-column file would silently append NULL columns.
          sqlite3 "${database}" <<SQL
        .bail on
        PRAGMA foreign_keys = ON;
        CREATE TEMP TABLE keep_path(path TEXT PRIMARY KEY);
        .mode tabs
        .import /tmp/attic-keep-paths.sorted keep_path
        DELETE FROM object
          WHERE NOT EXISTS (
            SELECT 1 FROM keep_path WHERE keep_path.path = object.store_path
          );
        SQL
          foreign_key_violations="$(sqlite3 "${database}" 'PRAGMA foreign_key_check;')"
          if [[ -n "${foreign_key_violations}" ]]; then
            echo '::error::Attic database has foreign-key violations after pruning.'
            printf '%s\n' "${foreign_key_violations}"
            exit 1
          fi
          after="$(sqlite3 "${database}" 'SELECT count(*) FROM object;')"
          echo "Pruned $(( before - after )) stale Attic objects; ${after} current objects remain."
        else
          echo '::warning::No current closure keep-set was received; preserving all Attic objects.'
        fi

        # Re-check retained objects against public binary caches. Attic's
        # upstream-signature filter handles new uploads; this pass removes
        # restored private objects that became public after an earlier run.
        sqlite3 "${database}" 'SELECT store_path FROM object;' \
          > /tmp/attic-current-paths.txt
        python3 - /tmp/attic-current-paths.txt \
          /tmp/attic-upstream-paths.txt <<'PY'
        import concurrent.futures
        import os
        import sys
        import urllib.error
        import urllib.request

        input_path, output_path = sys.argv[1:]
        substituters = [
            url.rstrip("/")
            for url in os.environ["UPSTREAM_SUBSTITUTERS"].splitlines()
            if url.strip()
        ]
        request_headers = {"User-Agent": "nix-ci-attic-prune"}

        def available(url):
            request = urllib.request.Request(
                f"{url}/nix-cache-info", method="HEAD", headers=request_headers
            )
            try:
                with urllib.request.urlopen(request, timeout=10):
                    return True
            except (urllib.error.URLError, TimeoutError):
                return False

        with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:
            live_substituters = [
                url
                for url, live in zip(
                    substituters, executor.map(available, substituters), strict=True
                )
                if live
            ]

        paths = [
            line.rstrip("\n")
            for line in open(input_path, encoding="utf-8")
            if line.strip()
        ]

        def publicly_available(path):
            store_hash = os.path.basename(path).split("-", 1)[0]
            for substituter in live_substituters:
                request = urllib.request.Request(
                    f"{substituter}/{store_hash}.narinfo",
                    method="HEAD",
                    headers=request_headers,
                )
                try:
                    with urllib.request.urlopen(request, timeout=10):
                        return path
                except (urllib.error.URLError, TimeoutError):
                    pass
            return None

        with open(output_path, "w", encoding="utf-8") as output:
            with concurrent.futures.ThreadPoolExecutor(max_workers=64) as executor:
                for path in executor.map(publicly_available, paths):
                    if path is not None:
                        output.write(f"{path}\n")

        print(
            f"Checked {len(paths)} retained objects against "
            f"{len(live_substituters)} reachable public substituters."
        )
        PY
        public_count="$(wc -l < /tmp/attic-upstream-paths.txt)"
        if (( public_count > 0 )); then
          sqlite3 "${database}" <<SQL
        .bail on
        PRAGMA foreign_keys = ON;
        CREATE TEMP TABLE public_path(path TEXT PRIMARY KEY);
        .mode tabs
        .import /tmp/attic-upstream-paths.txt public_path
        DELETE FROM object
          WHERE EXISTS (
            SELECT 1 FROM public_path
            WHERE public_path.path = object.store_path
          );
        SQL
        fi
        echo "Removed ${public_count} objects now available from public substituters."
        foreign_key_violations="$(sqlite3 "${database}" 'PRAGMA foreign_key_check;')"
        if [[ -n "${foreign_key_violations}" ]]; then
          echo '::error::Attic database has foreign-key violations after upstream pruning.'
          printf '%s\n' "${foreign_key_violations}"
          exit 1
        fi

        # Reap NARs orphaned by either deterministic or upstream pruning,
        # including interrupted uploads from red builds.
        "${atticd_bin}" -f "${config}" --mode garbage-collector-once
        sqlite3 "${database}" 'PRAGMA wal_checkpoint(TRUNCATE); VACUUM;'
        integrity="$(sqlite3 "${database}" 'PRAGMA integrity_check;')"
        if [[ "${integrity}" != ok ]]; then
          echo "::error::Attic SQLite database failed final integrity_check: ${integrity}"
          exit 1
        fi
        echo 'save-ready=true' >>"${GITHUB_OUTPUT}"
        echo "Final persisted Attic data size: $(du -sh "${DATA_DIR}" | cut -f1)."
