name: Start builder store cache
description: >-
  Start the Attic binary-cache server for this run's builders and return
  immediately, leaving atticd running in the background. Pairs with
  finalize-builder-store-cache, which waits for the coordinator, prunes,
  and shuts the server down. Splitting the lifecycle lets the job snapshot
  a consistent mid-run checkpoint generation while the server is live.

inputs:
  cache-host:
    description: Tailnet hostname clients use for the Attic endpoint.
    required: true
  cache-name:
    description: Attic cache name.
    required: false
    default: builder
  data-dir:
    description: Directory persisted by GitHub Actions Cache.
    required: false
    default: /nix/attic-data
  port:
    description: Attic HTTP port on the tailnet.
    required: false
    default: '8080'
  attic-nixpkgs-rev:
    description: Pinned nixpkgs revision providing prebuilt Attic tools.
    required: false
    default: 2fcb964de67fcf60b43471c55d5d99e61a9ccb5a
  upstream-cache-key-names:
    description: >-
      Newline-separated public signing key names. Paths carrying one of
      these signatures are not stored in Attic.
    required: false
    default: |-
      cache.nixos.org-1
      cache.nixos-cuda.org
      mzwing.cachix.org-1
      nix-community.cachix.org-1
      devenv.cachix.org-1
      lantian

runs:
  using: composite
  steps:
    - name: Start Attic
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CACHE_HOST: ${{ inputs.cache-host }}
        CACHE_NAME: ${{ inputs.cache-name }}
        DATA_DIR: ${{ inputs.data-dir }}
        PORT: ${{ inputs.port }}
        ATTIC_NIXPKGS_REV: ${{ inputs.attic-nixpkgs-rev }}
        UPSTREAM_CACHE_KEY_NAMES: ${{ inputs.upstream-cache-key-names }}
      run: |
        set -euo pipefail
        if [[ ! "${PORT}" =~ ^[1-9][0-9]*$ ]] || (( PORT > 65535 )); then
          echo "::error::port must be between 1 and 65535, got ${PORT}."
          exit 1
        fi
        # A fresh hosted runner cannot carry signals across runs. Preserve an
        # already-created done file: the coordinator may legitimately finish
        # while this parallel job is still restoring/starting Attic.
        rm -f /tmp/attic-client.json

        # Both outputs are prebuilt in cache.nixos.org for this Linux host.
        # Resolve them directly instead of constructing a profile; max-jobs=0
        # makes a missing substitute fail rather than compile Attic locally.
        attic_server_path="$(nix eval --raw \
          "github:NixOS/nixpkgs/${ATTIC_NIXPKGS_REV}#attic-server.outPath")"
        attic_client_path="$(nix eval --raw \
          "github:NixOS/nixpkgs/${ATTIC_NIXPKGS_REV}#attic-client.outPath")"
        nix-store --realise --option max-jobs 0 \
          "${attic_server_path}" "${attic_client_path}" >/dev/null
        atticd_bin="${attic_server_path}/bin/atticd"
        atticadm_bin="${attic_server_path}/bin/atticadm"
        attic_bin="${attic_client_path}/bin/attic"

        sudo install -d -o "$(id -u)" -g "$(id -g)" "${DATA_DIR}"
        install -d "${DATA_DIR}/storage"
        database="${DATA_DIR}/server.db"
        touch "${database}"
        # Validate the schema that the deterministic prune/query logic uses.
        # The Attic revision is pinned, so a mismatch means the restored data
        # must not replace the last known-good Actions cache generation.
        if [[ -s "${database}" ]]; then
          integrity="$(sqlite3 "${database}" 'PRAGMA integrity_check;' 2>&1 || true)"
          if [[ "${integrity}" != ok ]]; then
            echo "::error::Restored Attic SQLite database failed integrity_check: ${integrity}"
            exit 1
          fi
          if ! sqlite3 "${database}" \
            "SELECT store_path, cache_id, nar_id, deriver FROM object LIMIT 0;" \
            >/dev/null 2>&1; then
            echo '::error::Restored Attic database does not have the expected pinned schema.'
            exit 1
          fi
        fi
        # narinfo queries sit on the build scheduling critical path and must
        # not queue behind push write transactions. WAL lets readers proceed
        # concurrently with the single writer; the mode persists in the
        # database header, so restored generations keep it too.
        sqlite3 "${database}" 'PRAGMA journal_mode=WAL;'
        jwt_secret="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
        api_endpoint="http://${CACHE_HOST}:${PORT}/"
        cache_endpoint="${api_endpoint}${CACHE_NAME}"
        config=/tmp/attic-server.toml
        cat >"${config}" <<EOF
        listen = "[::]:${PORT}"
        allowed-hosts = []
        api-endpoint = "${api_endpoint}"
        substituter-endpoint = "${api_endpoint}"
        soft-delete-caches = false
        require-proof-of-possession = false

        [database]
        url = "sqlite://${database}?mode=rwc"

        [storage]
        type = "local"
        path = "${DATA_DIR}/storage"

        [chunking]
        # Store crate-scale NARs whole. Content-defined chunking costs a
        # zstd pass, a hash and SQLite rows per 64K chunk (~30 rows for a
        # 2 MiB crate output), which caps the single server at ~1-2
        # paths/s under load. A 1 TiB threshold disables chunking for every
        # realistic NAR; cross-NAR chunk dedupe is worthless for this
        # mostly-unique build-output workload, and identical NARs still
        # dedupe by NAR hash.
        nar-size-threshold = 1099511627776
        min-size = 1048576
        avg-size = 4194304
        max-size = 16777216

        [compression]
        type = "zstd"
        level = 3

        [garbage-collection]
        interval = "0 seconds"
        default-retention-period = "0 seconds"

        [jwt.signing]
        token-hs256-secret-base64 = "${jwt_secret}"
        EOF
        chmod 600 "${config}"

        # atticd must outlive this step (the job continues with checkpoint
        # and finalize steps), so do not trap/kill it here; the finalize
        # action stops it via the pid file.
        "${atticd_bin}" -f "${config}" >/tmp/atticd.log 2>&1 &
        atticd_pid=$!
        printf '%s\n' "${atticd_pid}" >/tmp/atticd.pid
        printf '%s\n' "${atticd_bin}" >/tmp/atticd-bin

        ready=false
        for _ in {1..60}; do
          if ! kill -0 "${atticd_pid}" 2>/dev/null; then
            echo '::error::Attic exited before becoming ready.'
            cat /tmp/atticd.log
            exit 1
          fi
          if (exec 3<>"/dev/tcp/127.0.0.1/${PORT}") 2>/dev/null; then
            exec 3>&-
            ready=true
            break
          fi
          sleep 2
        done
        if [[ "${ready}" != true ]]; then
          echo '::error::Timed out waiting for Attic to listen.'
          cat /tmp/atticd.log
          exit 1
        fi

        admin_token="$(${atticadm_bin} -f "${config}" make-token \
          --sub nur-ci-admin \
          --validity '8 hours' \
          --pull "${CACHE_NAME}" \
          --push "${CACHE_NAME}" \
          --delete "${CACHE_NAME}" \
          --create-cache "${CACHE_NAME}" \
          --configure-cache "${CACHE_NAME}" \
          --configure-cache-retention "${CACHE_NAME}" \
          --destroy-cache "${CACHE_NAME}")"
        admin_token="$(tr -d '\r\n' <<<"${admin_token}")"

        export XDG_CONFIG_HOME=/tmp/attic-admin-config
        install -d -m 700 "${XDG_CONFIG_HOME}/attic"
        "${attic_bin}" login --set-default ci "${api_endpoint}" "${admin_token}"
        upstream_args=()
        while IFS= read -r key_name; do
          [[ -n "${key_name}" ]] || continue
          upstream_args+=(--upstream-cache-key-name "${key_name}")
        done <<<"${UPSTREAM_CACHE_KEY_NAMES}"

        if "${attic_bin}" cache info "ci:${CACHE_NAME}" >/dev/null 2>&1; then
          # Rotate the cache key every run. The key embedded in an Actions
          # cache entry is therefore stale before any restored object is
          # served, and clients trust only this run's dynamically fetched key.
          "${attic_bin}" cache configure \
            --regenerate-keypair \
            --public \
            "${upstream_args[@]}" \
            "ci:${CACHE_NAME}"
        else
          "${attic_bin}" cache create \
            --public \
            "${upstream_args[@]}" \
            "ci:${CACHE_NAME}"
        fi
        # `attic cache info` intentionally writes its report to stderr.
        cache_info="$(${attic_bin} cache info "ci:${CACHE_NAME}" 2>&1)"
        public_key="$(sed -n 's/^[[:space:]]*Public Key:[[:space:]]*//p' <<<"${cache_info}")"
        if [[ ! "${public_key}" =~ ^[a-zA-Z0-9._-]+:[A-Za-z0-9+/]{43}=$ ]]; then
          echo '::error::Could not obtain Attic cache signing public key.'
          printf '%s\n' "${cache_info}"
          exit 1
        fi
        curl --fail --silent --show-error "${cache_endpoint}/nix-cache-info" >/dev/null

        # Builders receive only pull/push rights. Administrative cache
        # creation, deletion, retention and key-rotation permissions never
        # leave this machine.
        push_token="$(${atticadm_bin} -f "${config}" make-token \
          --sub nur-ci-builder \
          --validity '8 hours' \
          --pull "${CACHE_NAME}" \
          --push "${CACHE_NAME}")"
        push_token="$(tr -d '\r\n' <<<"${push_token}")"
        jq -n \
          --arg apiEndpoint "${api_endpoint}" \
          --arg cacheEndpoint "${cache_endpoint}" \
          --arg publicKey "${public_key}" \
          --arg token "${push_token}" \
          '{apiEndpoint: $apiEndpoint, cacheEndpoint: $cacheEndpoint,
            publicKey: $publicKey, token: $token}' \
          >/tmp/attic-client.json
        chmod 600 /tmp/attic-client.json
        echo "Attic is ready at ${cache_endpoint}; persisted data currently uses $(du -sh "${DATA_DIR}" | cut -f1)."
