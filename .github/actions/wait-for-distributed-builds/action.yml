name: Wait for distributed builds
description: >-
  Builder-side wait loop for distributed builds: wait until the
  coordinator claims this builder (/tmp/builder_claimed), then idle until
  it signals completion (/tmp/builder_done). Fails if the builder is not
  claimed within 10 minutes.

runs:
  using: composite
  steps:
    - name: Wait for distributed builds
      shell: bash
      run: |
        for _ in {1..120}; do
          if [[ -e /tmp/builder_claimed ]]; then
            while true; do
              echo 'Building...'
              for _ in {1..12}; do
                [[ -e /tmp/builder_done ]] && exit 0
                sleep 5
              done
            done
          fi
          sleep 5
        done
        echo 'Coordinator did not claim this builder within 10 minutes.' >&2
        exit 1
