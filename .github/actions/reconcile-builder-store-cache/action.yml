name: Reconcile builder store cache
description: >-
  Close the persistence gap of the post-build hook before the run ends.
  The hook (setup-builder-store-cache) pushes every locally built path
  to the central cache fire-and-forget: a failed push is invisible, and
  the cache machine's GC keep-set (nix-store -qR --include-outputs) only
  covers outputs that are VALID there — a path that never arrived is
  collected before the store is saved, forcing a rebuild of it and its
  entire dependent subtree on the next run. This action computes every
  output of every derivation in the build closure WITHOUT a validity
  filter, finds the ones missing from the cache machine, and copies them
  over from whichever builder still holds them. Run it on the
  coordinator AFTER the builds (and the Cachix push) but BEFORE
  release-remote-builders signals the builders and the cache machine:
  the builders must still be alive to serve as copy sources, and the
  cache machine's final signing pass (on /tmp/cache_done) signs the
  imported paths before the GC keep-set is computed.

inputs:
  builders-json:
    description: 'Builder matrix JSON ({"include": [{"id", ...}, ...]}).'
    required: true
  builder-prefix:
    description: Hostname prefix of the builders (e.g. nix-b-<run_id>-<attempt>).
    required: true
  cache-host:
    description: Hostname of the builder store cache node on the tailnet.
    required: true
  drvs-file:
    description: Nix file evaluating to a JSON list of .drv paths.
    required: false
    default: ci/drvs.nix

runs:
  using: composite
  steps:
    - name: Reconcile builder store cache
      shell: bash
      env:
        BUILDERS_JSON: ${{ inputs.builders-json }}
        BUILDER_PREFIX: ${{ inputs.builder-prefix }}
        CACHE_HOST: ${{ inputs.cache-host }}
        DRVS_FILE: ${{ inputs.drvs-file }}
      run: |
        set -euo pipefail

        # Every output of every derivation in the build closure. CA
        # derivations have no resolvable output paths; those are skipped.
        nix eval --json --impure --file "${DRVS_FILE}" | jq -r '.[]' \
          > /tmp/reconcile-top-drvs.txt
        xargs -a /tmp/reconcile-top-drvs.txt nix-store --query --requisites \
          | grep '\.drv$' | sort --unique > /tmp/reconcile-drvs.txt
        # `nix derivation show` wraps its output in {"derivations": ...}
        # since nix 2.30; the jq fallback keeps both shapes working. The
        # wrapped shape also reports output paths RELATIVE to the store
        # directory, so prepend it when missing — the probes compare
        # against absolute paths from nix-store --dump-db.
        store_dir="$(nix eval --raw --expr 'builtins.storeDir')"
        xargs -a /tmp/reconcile-drvs.txt -n 100 nix derivation show \
          | jq -r --arg store "${store_dir}" '
            (.derivations // .) | to_entries[].value.outputs[].path // empty
            | if startswith("/") then . else "\($store)/\(.)" end' \
          | sort --unique > /tmp/reconcile-expected.txt
        echo "Build closure has $(wc -l < /tmp/reconcile-expected.txt) output paths."

        # Print the subset of $2 that is valid in the store on host $1.
        # Dumps the remote database over plain ssh in a single session:
        # `nix path-info --store ssh-ng://...` tries to REALISE missing
        # paths and aborts the whole batch on the first one, and per-path
        # narinfo lookups are slow; a DB dump is one round-trip and a
        # pure query. Reference lines in the dump are valid paths too
        # (referential integrity), so keeping them is correct. $2 is
        # sorted, and so is the comm output.
        probe() {
          # The dump can legitimately come back empty (unreachable host,
          # fresh store): grep then exits 1, which must not kill the step.
          ssh -n "root@$1" nix-store --dump-db 2>/dev/null \
            | grep '^/nix/store/' | sort --unique > /tmp/reconcile-host-paths.txt || true
          comm -12 "$2" /tmp/reconcile-host-paths.txt
        }

        probe "${CACHE_HOST}" /tmp/reconcile-expected.txt \
          > /tmp/reconcile-on-cache.txt
        comm -23 /tmp/reconcile-expected.txt /tmp/reconcile-on-cache.txt \
          > /tmp/reconcile-missing.txt
        echo "$(wc -l < /tmp/reconcile-missing.txt) outputs are missing from the cache machine."

        # Copy each missing output from the first builder that has it.
        # export | import is the same mechanism the post-build hook uses;
        # here it runs synchronously with visible errors instead of
        # fire-and-forget. Outputs found on no builder were never built
        # (failed packages, systems without targets this run) and are
        # left for the next run.
        cp /tmp/reconcile-missing.txt /tmp/reconcile-remaining.txt
        while IFS= read -r id; do
          [[ -s /tmp/reconcile-remaining.txt ]] || break
          builder="${BUILDER_PREFIX}-${id}"
          probe "${builder}" /tmp/reconcile-remaining.txt \
            > /tmp/reconcile-found.txt
          [[ -s /tmp/reconcile-found.txt ]] || continue
          echo "Copying $(wc -l < /tmp/reconcile-found.txt) outputs from ${builder}."
          # BUILDER is placed in xargs's environment and inherited by the
          # inner sh, like CACHE_HOST from the step env.
          if ! BUILDER="${builder}" xargs -a /tmp/reconcile-found.txt -n 100 -r sh -c '
            ssh root@"${BUILDER}" nix-store --export "$@" |
              ssh root@"${CACHE_HOST}" nix-store --import >/dev/null
          ' sh; then
            echo "::warning::Failed to copy some outputs from ${builder}; continuing."
          fi
          comm -23 /tmp/reconcile-remaining.txt /tmp/reconcile-found.txt \
            > /tmp/reconcile-remaining.next
          mv /tmp/reconcile-remaining.next /tmp/reconcile-remaining.txt
        done < <(jq -r '.include[].id' <<<"${BUILDERS_JSON}")

        left="$(wc -l < /tmp/reconcile-remaining.txt)"
        if (( left > 0 )); then
          echo "${left} outputs exist on no builder (never built this run); skipping."
        fi
