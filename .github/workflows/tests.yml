name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test flake and workflows
    runs-on: ubuntu-latest
    permissions:
      # actions: write is required to purge stale store cache entries.
      actions: write
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-pull: 'false'
          install-devenv: 'true'

      - name: Restore Nix store
        uses: ./.github/actions/restore-nix-store
        with:
          primary-key: nix-tests-${{ hashFiles('flake.lock', 'devenv.lock') }}
          restore-prefix: nix-tests-

      - name: Check flake
        run: just flake-check

      - name: Type-check Nix
        run: just typecheck

      - name: Lint GitHub Actions
        run: actionlint

      - name: Lint Python scripts
        run: |
          ruff format --check scripts/
          ruff check scripts/
          ty check scripts/

      - name: Check formatting
        run: |
          just fmt
          if git status --porcelain | grep -q .; then
            git status --short
            exit 1
          fi
