name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test flake and workflows
    runs-on: ubuntu-latest
    permissions:
      # actions: write is required to purge stale store cache entries.
      actions: write
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: mzwing/nix-actions/nix/setup@master
        with:
          cachix-pull: 'false'
          install-devenv: 'true'

      # One cache family (nix-ci-) shared with build.yml and update.yml. The key must hash every job's lock inputs and use the same gc size.
      - name: Restore Nix store
        uses: mzwing/nix-actions/nix/restore-store@master
        with:
          primary-key: nix-ci-${{ hashFiles('flake.lock', 'devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-prefix: nix-ci-
          gc-max-store-size-linux: 4G

      - name: Check flake
        run: just flake-check

      - name: Type-check Nix
        run: just typecheck

      - name: Check feature names match their paths
        run: bash scripts/ci/check-feature-names.sh

      - name: Lint GitHub Actions
        run: actionlint

      - name: Lint Python scripts
        run: |
          ruff format --check scripts/
          ruff check scripts/
          ty check scripts/

      # Only the CI scripts: shfmt rewrites associative-array subscripts as arithmetic, so it must not be pointed at shell embedded in Nix packages.
      - name: Lint shell scripts
        run: |
          git ls-files 'scripts/ci/*.sh' | xargs shfmt --diff
          git ls-files 'scripts/ci/*.sh' | xargs shellcheck

      - name: Check formatting
        run: |
          just fmt
          if git status --porcelain | grep -q .; then
            git status --short
            exit 1
          fi
