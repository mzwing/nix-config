name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    name: Test flake and workflows
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: mzwing/nix-actions/nix/setup@master
        with:
          cachix-pull: 'false'
          install-devenv: 'true'

      # A reader: update.yml is the sole writer of this cache family.
      - name: Restore Nix store
        uses: mzwing/nix-actions/nix/restore-store@master
        with:
          save: 'false'

      - name: Check flake
        run: just flake-check

      - name: Lint
        run: just lint
