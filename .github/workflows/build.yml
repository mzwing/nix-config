name: Populate CI cache

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_NAME: mzwing
  BUILDER_PREFIX: nix-b-${{ github.run_id }}-${{ github.run_attempt }}
  CACHE_HOST: nix-cache-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  config:
    name: Plan CI cache build
    runs-on: ubuntu-latest
    permissions:
      # actions: write is required to purge stale store cache entries.
      actions: write
      contents: read
    outputs:
      builders: ${{ steps.plan.outputs.builders }}
      devenv_outputs: ${{ steps.evaluate.outputs.devenv_outputs }}
      devenv_systems: ${{ steps.plan.outputs.devenv_systems }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        extra-trusted-public-keys: devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
        install-devenv: 'true'

    # Shared with the "Restore Nix store" steps of update.yml and
    # tests.yml: one cache family (nix-ci-) for all jobs, so this job
    # restores the warm cache saved by the daily update run (which always
    # precedes the builds it triggers). The key must hash the union of
    # all jobs' lock inputs and use the same gc size. The action also
    # removes stale root-owned store lock files (left behind by
    # interrupted builds or substitutions of earlier runs; they break the
    # unprivileged tar of the post-run store save) and purges stale cache
    # entries in the post (save) phase: keep at most the entry just saved
    # (protected by purge-primary-key: never) and the one it was restored
    # from.
    - name: Restore Nix store
      uses: mzwing/nix-actions/nix/restore-store@master
      with:
        primary-key: nix-ci-${{ hashFiles('flake.lock', 'devenv.lock', 'devenv.nix', 'devenv.yaml') }}
        restore-prefix: nix-ci-
        gc-max-store-size-linux: 4G

    - name: Evaluate CI targets
      id: evaluate
      shell: bash
      run: scripts/ci/evaluate-targets.sh

    - name: Check caches and generate build matrix
      id: plan
      env:
        ALL_TARGETS: ${{ steps.evaluate.outputs.targets }}
        DEVENV_OUTPUTS: ${{ steps.evaluate.outputs.devenv_outputs }}
      run: python3 scripts/ci/plan-builds.py

  builder:
    name: Builder ${{ matrix.id }}
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    # Builders are passive and must outlive the coordinator, but still stop short of the runner's hard 6-hour limit so their post steps run instead of being cancelled.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.builders) }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    # Cachix is pull-only on builders: only final outputs (host
    # configurations and devenv shells) are pushed there, by the
    # coordinator. Locally built paths (config-specific intermediate
    # derivations, ...) go to the central builder store cache instead
    # (see the "cache" job), which also keeps the Cachix write token off
    # the unsandboxed macOS builders.
    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        cachix-pull: 'true'

    - name: Join builder network
      uses: mzwing/nix-actions/tailnet/join@master
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nix-ci-builder
        hostname: ${{ env.BUILDER_PREFIX }}-${{ matrix.id }}
        args: --ssh

    # macOS only: the join action restores the runner's DNS after joining
    # (with DNS accepted, the tailscale action replaces the system DNS
    # with quad100 and the runner loses public internet access, so it is
    # reset back to DHCP). This also drops MagicDNS, hence the /etc/hosts
    # pin; Linux builders resolve ${CACHE_HOST} via split DNS.
    - name: Resolve builder store cache address
      if: endsWith(matrix.system, '-darwin')
      uses: mzwing/nix-actions/tailnet/pin-peer@master
      with:
        hostname: ${{ env.CACHE_HOST }}

    # Fetch run-local Attic credentials only after joining the tailnet.
    # The sparse post-build push excludes paths signed by public upstreams.
    - name: Configure builder store cache
      uses: mzwing/nix-actions/store-cache/connect@master
      with:
        cache-host: ${{ env.CACHE_HOST }}

    - name: Wait for distributed builds
      uses: mzwing/nix-actions/builders/serve@master

  # Central sparse Attic cache for the builders. Its narinfos may reference
  # public-cache paths without persisting them, so Actions Cache contains
  # only private/local NARs. Reconciliation installs the current-lock
  # keep-set; shutdown then prunes stale objects deterministically.
  cache:
    name: Builder store cache
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    # 420 was silently capped at the runner's 6-hour maximum, which cancels the job and so skips the final save — the run's whole point.
    timeout-minutes: 355
    permissions:
      # actions: write is required to purge expired cache entries.
      actions: write
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cachix-name: ${{ env.CACHE_NAME }}

    - name: Prepare Attic data directory
      uses: mzwing/nix-actions/store-cache/prepare-dirs@master

    # Restore only Attic's database and NAR storage, never the ordinary
    # /nix/store. A unique key avoids save races; prefix restore picks the
    # latest generation.
    - name: Restore builder store cache
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-builder-attic-${{ github.run_id }}-${{ github.run_attempt }}
        restore-prefixes-first-match: nix-builder-attic-
        nix: false
        paths: /nix/attic-data

    # A surviving checkpoint entry always postdates the newest finalized
    # generation: checkpoints snapshot the restored generation plus the
    # run's pushes so far, and every successful final save purges the
    # checkpoint family. So whenever one exists, adopt it over the
    # finalized restore.
    - name: Restore checkpoint builder store cache
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-builder-atticchk-${{ github.run_id }}-${{ github.run_attempt }}
        restore-prefixes-first-match: nix-builder-atticchk-
        nix: false
        paths: /nix/attic-checkpoint

    - name: Adopt checkpoint generation
      uses: mzwing/nix-actions/store-cache/adopt-checkpoint@master

    - name: Join cache network
      uses: mzwing/nix-actions/tailnet/join@master
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nix-ci-cache
        hostname: ${{ env.CACHE_HOST }}
        args: --ssh

    # Starts Attic in the background and returns; the job continues with
    # the mid-run checkpoint snapshot before the finalize step shuts Attic
    # down. Client bootstrap (push-only token, rotated signing key) is
    # published over Tailscale SSH as before.
    - name: Start Attic
      uses: mzwing/nix-actions/store-cache/start@master
      with:
        cache-host: ${{ env.CACHE_HOST }}

    # Checkpoint rounds: the coordinator signals right after its Cachix push, but a cold rebuild can run for hours before that.
    # Each round stages a consistent snapshot on signal OR timeout, so even a cancelled run leaves a recent warm generation behind, and rounds with no new objects stage nothing.
    #
    # Three rounds rather than six: six waited 345 minutes in total, so the job spent its whole 6 hours inside the last round and was cancelled before Finalize could hand a generation to the save step.
    # Rounds are not free insurance either — each save re-uploads the entire multi-GiB generation into a 10 GiB repository-wide quota.
    - name: Wait for checkpoint (round 1)
      id: attic-checkpoint-1
      uses: mzwing/nix-actions/store-cache/checkpoint@master
      with:
        timeout-minutes: '60'

    - name: Reclaim Actions cache quota (round 1)
      if: ${{ !cancelled() && steps.attic-checkpoint-1.outputs.checkpoint-ready == 'true' }}
      uses: mzwing/nix-actions/store-cache/reclaim-quota@master
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Save builder store cache checkpoint (round 1)
      if: ${{ !cancelled() && steps.attic-checkpoint-1.outputs.checkpoint-ready == 'true' }}
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: nix-builder-atticchk-${{ github.run_id }}-${{ github.run_attempt }}-1
        nix: false
        paths: /nix/attic-checkpoint
        purge: true
        purge-prefixes: nix-builder-atticchk-
        purge-last-accessed: 0
        purge-primary-key: never

    - name: Wait for checkpoint (round 2)
      id: attic-checkpoint-2
      uses: mzwing/nix-actions/store-cache/checkpoint@master
      with:
        timeout-minutes: '90'

    - name: Reclaim Actions cache quota (round 2)
      if: ${{ !cancelled() && steps.attic-checkpoint-2.outputs.checkpoint-ready == 'true' }}
      uses: mzwing/nix-actions/store-cache/reclaim-quota@master
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Save builder store cache checkpoint (round 2)
      if: ${{ !cancelled() && steps.attic-checkpoint-2.outputs.checkpoint-ready == 'true' }}
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: nix-builder-atticchk-${{ github.run_id }}-${{ github.run_attempt }}-2
        nix: false
        paths: /nix/attic-checkpoint
        purge: true
        purge-prefixes: nix-builder-atticchk-
        purge-last-accessed: 0
        purge-primary-key: never

    - name: Wait for checkpoint (round 3)
      id: attic-checkpoint-3
      uses: mzwing/nix-actions/store-cache/checkpoint@master
      with:
        timeout-minutes: '75'

    - name: Reclaim Actions cache quota (round 3)
      if: ${{ !cancelled() && steps.attic-checkpoint-3.outputs.checkpoint-ready == 'true' }}
      uses: mzwing/nix-actions/store-cache/reclaim-quota@master
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Save builder store cache checkpoint (round 3)
      if: ${{ !cancelled() && steps.attic-checkpoint-3.outputs.checkpoint-ready == 'true' }}
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: nix-builder-atticchk-${{ github.run_id }}-${{ github.run_attempt }}-3
        nix: false
        paths: /nix/attic-checkpoint
        purge: true
        purge-prefixes: nix-builder-atticchk-
        purge-last-accessed: 0
        purge-primary-key: never

    # The deadline covers the coordinator's remaining work after the last round and still leaves room inside the job for the save below; the 390-minute default outlived the job itself.
    - name: Finalize Attic
      id: attic
      uses: mzwing/nix-actions/store-cache/finalize@master
      with:
        deadline-minutes: '90'

    - name: Reclaim Actions cache quota
      if: ${{ !cancelled() && steps.attic.outputs.save-ready == 'true' }}
      uses: mzwing/nix-actions/store-cache/reclaim-quota@master
      env:
        GH_TOKEN: ${{ github.token }}

    # Save only after Attic shut down cleanly and passed integrity checks.
    # Keep exactly the latest sparse generation and purge legacy full-store
    # cache entries during migration.
    - name: Save builder store cache
      if: ${{ !cancelled() && steps.attic.outputs.save-ready == 'true' }}
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: nix-builder-attic-${{ github.run_id }}-${{ github.run_attempt }}
        nix: false
        paths: /nix/attic-data
        purge: true
        purge-prefixes: |-
          nix-builder-attic-
          nix-builder-atticchk-
          nix-builder-store-
        purge-last-accessed: 0
        purge-primary-key: never

  coordinator:
    name: Distributed build coordinator
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    # Below the runner maximum: the build steps budget themselves, leaving room for the Cachix push and reconciliation instead of being cancelled with the job.
    timeout-minutes: 350
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        extra-trusted-public-keys: devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
        max-jobs: '0'
        install-devenv: 'true'

    - name: Join coordinator network
      uses: mzwing/nix-actions/tailnet/join@master
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nix-ci-coordinator
        hostname: nix-c-${{ github.run_id }}-${{ github.run_attempt }}

    # The coordinator substitutes locally built runtime dependencies
    # from the builder store cache when assembling the Cachix push
    # closure (they are no longer uploaded to Cachix by the builders).
    # Runs before the nix-daemon restart in "Configure remote builders"
    # so the daemon picks up the new substituter.
    - name: Configure builder store cache substituter
      uses: mzwing/nix-actions/store-cache/connect@master
      with:
        cache-host: ${{ env.CACHE_HOST }}
        post-build-hook: 'false'

    - name: Configure remote builders
      uses: mzwing/nix-actions/builders/attach@master
      with:
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}
        ssh-host-pattern: "nix-b-* nix-cache-*"

    # The builder store cache joins the tailnet in parallel (cache
    # job); make sure it is reachable — directly and through the first
    # builder — before building starts.
    - name: Check builder store cache reachability
      uses: mzwing/nix-actions/store-cache/verify@master
      with:
        cache-host: ${{ env.CACHE_HOST }}
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}

    - name: Build CI configurations
      if: needs.config.outputs.targets != '[]'
      env:
        TARGETS: ${{ needs.config.outputs.targets }}
        BUILD_TIMEOUT_MINUTES: '200'
        MAX_SILENT_SECONDS: '3600'
        BUILD_LOG: /tmp/nix-build.log
      shell: bash
      run: scripts/ci/build-configurations.sh

    # The job log is size-capped and silently truncates a long build; the artifact is not, so a post-mortem has the whole thing.
    - name: Upload build log
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: coordinator-build-log
        path: /tmp/nix-build.log
        if-no-files-found: ignore
        retention-days: 14

    - name: Build root devenv
      if: needs.config.outputs.devenv_systems != '[]'
      env:
        DEVENV_SYSTEMS: ${{ needs.config.outputs.devenv_systems }}
        DEVENV_OUTPUTS: ${{ needs.config.outputs.devenv_outputs }}
        DEVENV_TIMEOUT_MINUTES: '90'
      shell: bash
      run: scripts/ci/build-devenv.sh

    # Runs on red builds too: --keep-going means the build steps still realise the targets that succeeded.
    - name: Assemble Cachix push set
      if: '!cancelled()'
      env:
        TARGETS: ${{ needs.config.outputs.targets }}
      shell: bash
      run: scripts/ci/assemble-push-set.sh

    - name: Push final outputs to Cachix
      if: '!cancelled()'
      uses: mzwing/nix-actions/cachix/push@master
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      with:
        cachix-name: ${{ env.CACHE_NAME }}
        paths-file: /tmp/push-outputs.txt
        closure-paths-file: /tmp/cachix-published-closure.txt

    # Lets the cache job snapshot a consistent mid-run Attic generation
    # before reconciliation, so even a cancelled run leaves a warm cache.
    - name: Signal builder store cache checkpoint
      if: '!cancelled()'
      uses: mzwing/nix-actions/store-cache/signal-checkpoint@master
      with:
        cache-host: ${{ env.CACHE_HOST }}

    # Re-offer every output in the exact scheduled derivation closures while
    # builders are alive. Attic performs sparse no-closure uploads with six workers and
    # receives the same private expected set as its shutdown keep-list.
    - name: Reconcile builder store cache
      if: '!cancelled()'
      uses: mzwing/nix-actions/store-cache/reconcile@master
      with:
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}
        cache-host: ${{ env.CACHE_HOST }}
        active-drvs-file: /tmp/active-drvs.txt
        # Written atomically only after Cachix accepted the full closure.
        public-paths-file: /tmp/cachix-published-closure.txt
        extra-paths-file: /tmp/devenv-outputs.txt

    # Also signals the builder store cache machine that the run is over
    # (/tmp/cache_done, via the cache-host input).
    - name: Release remote builders
      if: always()
      uses: mzwing/nix-actions/builders/release@master
      with:
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}
        cache-host: ${{ env.CACHE_HOST }}
