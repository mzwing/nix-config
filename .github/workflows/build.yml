name: Populate CI cache

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_NAME: mzwing
  BUILDER_PREFIX: nix-b-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  config:
    name: Plan CI cache build
    runs-on: ubuntu-latest
    outputs:
      builders: ${{ steps.plan.outputs.builders }}
      devenv_systems: ${{ steps.plan.outputs.devenv_systems }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = false
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org https://attic.xuyh0120.win/lantian
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

    - name: Restore Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-config-${{ hashFiles('flake.lock', 'devenv.lock') }}
        restore-prefixes-first-match: nix-config-
        gc-max-store-size-linux: 2G

    # Interrupted builds or substitutions from earlier runs leave
    # root-owned <path>.lock files in /nix/store; they ride along in the
    # restored store cache and break the unprivileged tar of the
    # post-run store save. No nix process is running at this point, so
    # any lock file present is stale by definition.
    - name: Remove stale Nix store lock files
      run: sudo find /nix/store -maxdepth 1 -name '*.lock' -delete

    - name: Configure Cachix for pulls
      uses: cachix/cachix-action@v17
      with:
        name: ${{ env.CACHE_NAME }}
        skipPush: true

    - name: Install devenv
      run: nix profile add nixpkgs#devenv

    - name: Check flake evaluation
      run: nix flake check --all-systems --no-build --no-write-lock-file --show-trace

    - name: Evaluate CI targets
      id: evaluate
      shell: bash
      run: |
        set -euo pipefail
        printf 'targets=%s\n' "$(nix eval --json --file ci/targets.nix)" >>"${GITHUB_OUTPUT}"

        devenv_outputs='{}'
        for system in x86_64-linux aarch64-linux aarch64-darwin; do
          # devenv-nixpkgs-patched has allowSubstitutes = false, so nix
          # will not substitute it mid-evaluation and would try to build
          # it locally, which cannot work for foreign systems. Pre-seed
          # it from devenv.cachix.org instead.
          patched_src="$(DEVENV_SYSTEM="${system}" nix eval --raw --impure --file ci/devenv-patched-src.nix)"
          if ! nix copy --from https://devenv.cachix.org "${patched_src}"; then
            printf '::warning::Could not pre-seed %s from devenv.cachix.org; foreign-system devenv evaluation may fail.\n' "${patched_src}"
          fi
          packages="$(devenv eval -s "${system}" packages | jq -c .packages)"
          devenv_outputs="$(
            jq -c \
              --arg system "${system}" \
              --argjson packages "${packages}" \
              '. + {($system): $packages}' \
              <<<"${devenv_outputs}"
          )"
        done
        printf 'devenv_outputs=%s\n' "${devenv_outputs}" >>"${GITHUB_OUTPUT}"

    - name: Check caches and generate build matrix
      id: plan
      env:
        ALL_TARGETS: ${{ steps.evaluate.outputs.targets }}
        DEVENV_OUTPUTS: ${{ steps.evaluate.outputs.devenv_outputs }}
      run: python3 scripts/plan-builds.py

  builder:
    name: Builder ${{ matrix.id }}
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.builders) }}
    steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = false
          substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org https://attic.xuyh0120.win/lantian
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

    - name: Configure Cachix build daemon
      uses: cachix/cachix-action@v17
      with:
        name: ${{ env.CACHE_NAME }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: true

    - name: Enable Cachix uploads for remote builds
      run: sudo sh -c "cat '${CACHIX_DAEMON_DIR}/nix.conf' >> /etc/nix/nix.conf"

    - name: Join builder network
      uses: tailscale/github-action@v4
      env:
        TAILSCALE_SSH_DEFAULT_PATH: /nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nix-ci-builder
        hostname: ${{ env.BUILDER_PREFIX }}-${{ matrix.id }}
        args: --ssh --accept-dns=false
        version: latest

    - name: Restore macOS runner DNS
      if: endsWith(matrix.system, '-darwin')
      run: sudo networksetup -setdnsservers Ethernet empty

    - name: Wait for distributed builds
      shell: bash
      run: |
        for _ in {1..120}; do
          if [[ -e /tmp/builder_claimed ]]; then
            while true; do
              echo 'Building...'
              for _ in {1..12}; do
                [[ -e /tmp/builder_done ]] && exit 0
                sleep 5
              done
            done
          fi
          sleep 5
        done
        echo 'Coordinator did not claim this builder within 10 minutes.' >&2
        exit 1

  coordinator:
    name: Distributed build coordinator
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = false
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          max-jobs = 0
          substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org https://attic.xuyh0120.win/lantian
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

    - name: Configure Cachix for pulls
      uses: cachix/cachix-action@v17
      with:
        name: ${{ env.CACHE_NAME }}
        skipPush: true

    - name: Install devenv
      run: nix profile add nixpkgs#devenv

    - name: Join coordinator network
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nix-ci-coordinator
        hostname: nix-c-${{ github.run_id }}-${{ github.run_attempt }}
        version: latest

    - name: Configure remote builders
      env:
        BUILDERS: ${{ needs.config.outputs.builders }}
      shell: bash
      run: |
        set -euo pipefail

        sudo mkdir -p /etc/ssh/ssh_config.d
        sudo tee /etc/ssh/ssh_config.d/nix-ci-builders.conf >/dev/null <<'EOF'
        Host nix-b-*
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          BatchMode yes
          LogLevel ERROR
        EOF
        sudo tee /etc/nix/machines </dev/null

        while IFS=$'\t' read -r id system max_jobs; do
          builder="${BUILDER_PREFIX}-${id}"
          connected=false
          for _ in {1..120}; do
            if ssh -n -o ConnectTimeout=5 "root@${builder}" true 2>/dev/null; then
              connected=true
              break
            fi
            sleep 5
          done
          if [[ "${connected}" != true ]]; then
            printf 'Builder %s did not become reachable within 10 minutes.\n' "${builder}" >&2
            exit 1
          fi

          ssh -n "root@${builder}" 'touch /tmp/builder_claimed'
          printf 'ssh-ng://root@%s %s - %s 1 big-parallel,benchmark\n' \
            "${builder}" "${system}" "${max_jobs}" |
            sudo tee -a /etc/nix/machines >/dev/null
        done < <(jq -r '.include[] | [.id, .system, .maxJobs] | @tsv' <<<"${BUILDERS}")

        sudo tee -a /etc/nix/nix.conf >/dev/null <<'EOF'
        builders = @/etc/nix/machines
        builders-use-substitutes = true
        max-jobs = 0
        EOF
        sudo systemctl restart nix-daemon.service

    - name: Build CI configurations
      if: needs.config.outputs.targets != '[]'
      env:
        TARGETS: ${{ needs.config.outputs.targets }}
      shell: bash
      run: |
        set -euo pipefail
        build_systems="$(jq -c '[.[].system] | unique' <<<"${TARGETS}")"
        {
          printf '### Built CI configuration paths\n\n'
          BUILD_SYSTEMS="${build_systems}" nix build \
            --impure \
            --file ci/outputs.nix \
            --no-link \
            --no-write-lock-file \
            --print-build-logs \
            --print-out-paths \
            --max-jobs 0 \
            --keep-going |
            while IFS= read -r path; do
              printf -- "- \`%s\`\n" "${path}"
            done
        } >>"${GITHUB_STEP_SUMMARY}"

    - name: Build root devenv
      if: needs.config.outputs.devenv_systems != '[]'
      env:
        DEVENV_SYSTEMS: ${{ needs.config.outputs.devenv_systems }}
      shell: bash
      run: |
        set -euo pipefail
        printf '### Built root devenv systems\n\n' >>"${GITHUB_STEP_SUMMARY}"
        failed_systems=()
        while IFS= read -r system; do
          # See "Evaluate CI targets" for why this pre-seed is needed.
          patched_src="$(DEVENV_SYSTEM="${system}" nix eval --raw --impure --file ci/devenv-patched-src.nix)"
          if ! nix copy --from https://devenv.cachix.org "${patched_src}"; then
            printf '::warning::Could not pre-seed %s from devenv.cachix.org; foreign-system devenv build may fail.\n' "${patched_src}"
          fi
          # devenv build has no --keep-going; try every system and
          # report all failures at the end instead of stopping at the
          # first one.
          if devenv build shell -s "${system}" --max-jobs 0 --no-tui; then
            printf -- "- \`%s\`\n" "${system}" >>"${GITHUB_STEP_SUMMARY}"
          else
            failed_systems+=("${system}")
          fi
        done < <(jq -r '.[]' <<<"${DEVENV_SYSTEMS}")
        if ((${#failed_systems[@]} > 0)); then
          printf '::error::devenv build failed for: %s\n' "${failed_systems[*]}"
          exit 1
        fi

    - name: Release remote builders
      if: always()
      env:
        BUILDERS: ${{ needs.config.outputs.builders }}
      shell: bash
      run: |
        while IFS= read -r id; do
          ssh -n -o ConnectTimeout=5 "root@${BUILDER_PREFIX}-${id}" \
            'touch /tmp/builder_done' || true
        done < <(jq -r '.include[].id' <<<"${BUILDERS}")
