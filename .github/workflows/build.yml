name: Populate CI cache

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Distributed build
    permissions:
      contents: read
      # actions: write is required to clear the store cache family before each save.
      actions: write
    uses: mzwing/nix-actions/.github/workflows/distributed-build.yml@master
    with:
      name-prefix: nix
      devenv: true
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
