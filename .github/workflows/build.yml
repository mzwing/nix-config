name: Populate CI cache

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Distributed build
    permissions:
      contents: read
      # actions: write is required to clear the store cache family before each save.
      actions: write
    uses: mzwing/nix-actions/.github/workflows/distributed-build.yml@master
    with:
      name-prefix: nix
      devenv: true
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # A job here rather than a workflow_run listener: runs dispatched by update.yml's GITHUB_TOKEN never fire workflow_run.
  mirror:
    name: Push master to CNB
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/MZWNET/nix-config.git" HEAD:refs/heads/master
