name: Update lock files

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/update.yml
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lockfiles
  cancel-in-progress: false

jobs:
  update:
    name: Update lock files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Maximize Nix disk space
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = false
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org https://attic.xuyh0120.win/lantian
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-update-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-update-
          gc-max-store-size-linux: 4G

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Update devenv inputs
        run: devenv update

      - name: Update flake inputs
        shell: devenv shell bash -- -e {0}
        run: just up

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- devenv.lock flake.lock

          if git diff --cached --quiet; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "chore: update lockfile"
          echo "changed=true" >>"${GITHUB_OUTPUT}"

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          branch: ${{ github.ref }}

      - name: Trigger build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref ${{ github.ref }}
