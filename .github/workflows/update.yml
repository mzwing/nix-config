name: Update lock files

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/update.yml
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lockfiles
  cancel-in-progress: false

jobs:
  update:
    name: Update lock files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Maximize Nix disk space
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-pull: 'false'
          install-devenv: 'true'

      - name: Restore Nix store
        uses: ./.github/actions/restore-nix-store
        with:
          primary-key: nix-update-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-prefix: nix-update-
          gc-max-store-size-linux: 4G

      - name: Update devenv inputs
        run: devenv update

      - name: Update flake inputs
        shell: devenv shell bash -- -e {0}
        run: just up

      - name: Commit and push changes
        id: commit
        uses: ./.github/actions/commit-and-push
        with:
          paths: devenv.lock flake.lock
          message: "chore: update lockfile"
          trigger-workflow: build.yml
          github-token: ${{ github.token }}
